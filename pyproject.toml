[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-arcade"
version = "1.0.0"
description = "A collection of classic-style games that run in your terminal (Windows, macOS, Linux)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
]

[project.scripts]
arcade = "terminal_arcade.main:main"
terminal-arcade = "terminal_arcade.main:main"

[tool.setuptools]
packages = ["terminal_arcade", "terminal_arcade.games"]
